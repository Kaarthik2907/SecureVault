server:
  port: 8080

spring:
  application:
    name: securevault-backend
  datasource:
    url: jdbc:mysql://localhost:3306/securevault_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: vault_app
    password: apppassword
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

